<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FE4A03" />
      <stop offset="100%" stop-color="#DD2C00" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF8A65" stop-opacity="0.6" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#0A0A0C" />
  
  <!-- Subtle Border Inset -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="none" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="32" cy="32" r="18" fill="url(#brand-grad)" opacity="0.25" />

  <!-- Modern Geometric 'S' Monogram & Creative Lens Spark -->
  <path
    d="M44 21.5C44 16.8 40.2 13 35.5 13H25C20.6 13 17 16.6 17 21C17 25.4 20.6 29 25 29H39C43.4 29 47 32.6 47 37C47 41.4 43.4 45 39 45H27C21.5 45 17 40.5 17 35"
    stroke="url(#brand-grad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- High-Precision Center Flare / Core Spark -->
  <circle cx="32" cy="29" r="2.5" fill="url(#glow-grad)" filter="url(#subtle-glow)" />
  <circle cx="47" cy="17" r="2" fill="#FE4A03" />
</svg>
